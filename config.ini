; HOHAI 每日签到配置
; 也可以改用环境变量：HOHAI_USERNAME / HOHAI_PASSWORD / HOHAI_TG_BOT_TOKEN / HOHAI_TG_CHAT_ID

[hohai]
base_url = https://tv.hohai.eu.org
username = daniu
password = 1254408952.

; 是否无头运行。Cloudflare Turnstile 在无头模式下通过率低，建议 false（弹出真实窗口）
headless = false

; 单次签到最多等待的秒数
timeout = 180

; 代理，留空表示直连，例如 http://127.0.0.1:1081
; 注意：本机 127.0.0.1:10808 会把 brunhild.challenges.cloudflare.com 的 TLS 掐断，导致 Turnstile 必然失败
proxy =

; 用「真实 Chrome + CDP 接管」模式过盾（实测唯一稳定通过的方式，强烈建议 true）
use_cdp = true

; Telegram 通知，留空则不发
tg_bot_token =
tg_chat_id =
; 发 TG 单独走代理（国内直连不通）。签到本身仍直连，两者互不影响，例如 http://127.0.0.1:10808
tg_proxy =

; 调试用：true 时结束前保持浏览器打开 60 秒
keep_open = false